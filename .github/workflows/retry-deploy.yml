name: Retry Flaky Deploy

# The FTP host used by "Deploy to Web Host" intermittently drops/times out
# connections from some GitHub-hosted runner IPs but not others (confirmed by
# manually re-running failed jobs, which get a fresh runner with a new IP, and
# succeeding). lftp's own internal retries reconnect from the SAME runner/IP,
# so they can't route around a blocked IP — only a brand-new runner can.
#
# This workflow watches for "Deploy to Web Host" completing, and if it failed
# specifically on one of the known-flaky FTP steps, automatically re-runs the
# failed jobs on a fresh runner (up to 3 extra attempts). A genuine build/code
# failure is left alone — it never gets this far since the FTP steps only run
# after build/publish succeed, so those failures are never mistaken for FTP
# flakiness and still fail fast on the first attempt.
on:
  workflow_run:
    workflows: ["Deploy to Web Host"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry-if-ftp-flaked:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 4
    steps:
      - name: Check whether the failure was the known-flaky FTP step
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs_json=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs")
          ftp_failed=$(echo "$jobs_json" | jq '[.jobs[].steps[]? | select(.name == "Take site offline" or .name == "Deploy via FTP using lftp") | select(.conclusion == "failure")] | length > 0')
          echo "ftp_failed=$ftp_failed" >> "$GITHUB_OUTPUT"

      - name: Re-run the failed deploy on a fresh runner
        if: steps.check.outputs.ftp_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Deploy run ${{ github.event.workflow_run.id }} failed on the known-flaky FTP step (attempt ${{ github.event.workflow_run.run_attempt }}) — retrying on a fresh runner..."
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
